<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수링의 협찬 다이어리</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;color:#292929;background:#fafafa}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:28px}h2{font-size:19px}section{background:white;border:1px solid #e4e4e4;border-radius:12px;padding:20px;margin:16px 0}button,input,select,textarea{font:inherit;border:1px solid #ddd;border-radius:7px;padding:10px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#292929;color:white}label{display:grid;gap:5px;font-size:13px;color:#666}.fields,.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stats div{border:1px solid #eee;padding:15px;border-radius:8px}.stats strong{display:block;font-size:24px;margin-top:8px}.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.day{min-height:78px;border:1px solid #eee;padding:6px;overflow-wrap:anywhere;font-size:12px}.day button{padding:3px;border:0;background:#eee;width:100%;margin-top:4px;text-align:left;font-size:11px}.muted{color:#777;font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.item{border-top:1px solid #eee;padding:14px 0}.warn{color:#a34b19}textarea{width:100%} @media(max-width:600px){main{padding:12px}section{padding:12px}.day{min-height:58px;padding:3px}.day button{font-size:10px}}</style><main><p class="muted">SOORING / BLOG WORKSPACE</p><h1>수링의 협찬 다이어리</h1><p class="muted">협찬 일정과 콘텐츠를 한 곳에서 관리하세요.</p><section id="login"><h2>로그인</h2><form id="loginform"><label>이메일<input type="email" id="email" required></label><label>비밀번호<input type="password" id="password" required></label><p><button class="primary">로그인</button></p></form></section><div id="account" hidden><span id="rolelabel"></span> <button onclick="logout()">로그아웃</button></div><p id="syncmsg" role="status"></p><section id="partner" hidden><h2>우리의 방문 일정 및 리뷰 현황 ♡</h2><p class="muted">동행 여부를 선택해주세요. 온라인으로 동행 여부를 공유합니다.</p><div id="partnerItems"></div></section><div id="admin" hidden><section><div class="stats" id="stats"></div></section><section><h2>일정 문장으로 입력</h2><p class="muted">간단한 규칙 기반 입력 도우미 · 실제 GPT 연결 전</p><textarea id="sentence" placeholder="11월 28일 오후 6시 광교 맛집 5만원 리뷰 7일"></textarea><button onclick="parse()">입력란에 반영</button><p id="parsemsg" class="muted"></p></section><section><div class="row"><button onclick="shift(-1)">‹</button><h2 id="month"></h2><button onclick="shift(1)">›</button></div><div class="cal" id="cal"></div></section><section><h2 id="formtitle">협찬 등록</h2><form id="form"><div class="fields"><label>업체명<input name="name" required></label><label>지역 / 주소<input name="place"></label><label>방문일<input name="date" type="date"></label><label>예약 시간<input name="time" type="time"></label><label>체험 소요시간 (분)<input name="duration" type="number" min="0" value="90"></label><label>이동 여유시간 (분)<input name="travel" type="number" min="0" value="30"></label><label>리뷰 기한 (방문 후 일수)<input name="days" type="number" min="0" value="7"></label><label>상태<select name="status"><option>신청</option><option>선정</option><option selected>예약</option><option>방문</option><option>완료</option></select></label><label>제공 금액 (원)<input name="amount" type="number" min="0" value="0"></label><label>추가 지출 (원)<input name="cost" type="number" min="0" value="0"></label></div><p>업로드 완료: <label style="display:inline"><input type="checkbox" name="blog"> 블로그</label> <label style="display:inline"><input type="checkbox" name="insta"> 인스타</label> <label style="display:inline"><input type="checkbox" name="clip"> 클립</label></p><label>필수 키워드 및 가이드라인<textarea name="guide"></textarea></label><p id="warning" class="warn"></p><button class="primary">저장</button> <button type="button" onclick="resetForm()">새로 입력</button></form></section><section><h2>방문 및 리뷰 알림</h2><div id="alerts"></div></section><section><h2>협찬 목록</h2><div id="items"></div></section><section><h2>데이터 관리</h2><p class="muted">온라인 저장 · 15초마다 새로고침합니다. 백그라운드 알림은 미연결 상태입니다.</p><button onclick="backup()">백업 내보내기</button> </section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
let data=[];let now=new Date(),y=now.getFullYear(),m=now.getMonth(),editing=null;const f=document.getElementById('form'),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),key=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,today=()=>{let n=new Date();return key(n.getFullYear(),n.getMonth(),n.getDate())},add=(s,n)=>{if(!s)return '';let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+Number(n));return key(d.getFullYear(),d.getMonth(),d.getDate())},due=e=>add(e.date,e.days),money=n=>Number(n||0).toLocaleString('ko-KR')+'원';function save(){throw Error('온라인 저장을 사용하세요')}function values(){let o=Object.fromEntries(new FormData(f));for(let k of ['blog','insta','clip'])o[k]=f.elements[k].checked;return o}function conflicts(o){if(!o.date||!o.time)return [];let start=e=>new Date(e.date+'T'+e.time).getTime()/60000;return data.filter(e=>e.id!==editing&&e.date&&e.time&&e.status!=='신청'&&o.status!=='신청'&&start(o)<start(e)+Number(e.duration)+Math.max(Number(e.travel),Number(o.travel))&&start(e)<start(o)+Number(o.duration)+Math.max(Number(e.travel),Number(o.travel)))}f.oninput=()=>{$('warning').textContent=conflicts(values()).map(e=>'시간 또는 이동 여유 충돌: '+e.name).join(' / ')};f.onsubmit=ev=>{ev.preventDefault();let o=values();if(conflicts(o).length&&!confirm('시간 충돌 가능성이 있습니다. 저장할까요?'))return;o.id=editing||crypto.randomUUID();o.attendance=data.find(e=>e.id===o.id)?.attendance||"미정";data=data.filter(e=>e.id!==o.id);data.push(o);save();resetForm()};function resetForm(){editing=null;f.reset();$('formtitle').textContent='협찬 등록';$('warning').textContent=''}function edit(id){let e=data.find(x=>x.id===id);if(!e)return;editing=id;for(let k of Object.keys(e)){let el=f.elements[k];if(el){if(el.type==='checkbox')el.checked=!!e[k];else el.value=e[k]}}$('formtitle').textContent='협찬 수정';f.scrollIntoView({behavior:'smooth'})}function del(id){if(confirm('삭제할까요?')){data=data.filter(e=>e.id!==id);save()}}function shift(n){let d=new Date(y,m+n,1);y=d.getFullYear();m=d.getMonth();render()}function pick(d){f.elements.date.value=key(y,m,d);f.scrollIntoView({behavior:'smooth'})}function render(){let prefix=key(y,m,1).slice(0,7),a=data.filter(e=>e.date?.startsWith(prefix));$('month').textContent=`${y}년 ${m+1}월`;$('stats').innerHTML=[['월간 협찬',a.length+'건'],['제공 금액',money(a.reduce((s,e)=>s+Number(e.amount),0))],['추가 지출',money(a.reduce((s,e)=>s+Number(e.cost),0))],['방문 완료',a.filter(e=>['방문','완료'].includes(e.status)).length+'건']].map(([k,v])=>`<div>${k}<strong>${v}</strong></div>`).join('');let html=['일','월','화','수','목','금','토'].map(x=>`<div class="muted">${x}</div>`).join('');html+='<div></div>'.repeat(new Date(y,m,1).getDay());for(let d=1;d<=new Date(y,m+1,0).getDate();d++){let k=key(y,m,d);html+=`<div class="day"><a onclick="pick(${d})" style="cursor:pointer">${d}</a>${data.filter(e=>e.date===k||due(e)===k).map(e=>`<button onclick="edit('${esc(e.id)}')">${e.date===k?esc(e.time)+' ': '마감 · '}${esc(e.name)}</button>`).join('')}</div>`}$('cal').innerHTML=html;$('items').innerHTML=data.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(e=>`<div class="item"><strong>${esc(e.name)}</strong> · ${esc(e.status)} · 동행 ${esc(e.attendance||"미정")}<p>${esc(e.date)} ${esc(e.time)} · ${esc(e.place)} · 마감 ${due(e)||'미정'}</p><p class="muted">제공 ${money(e.amount)} / 지출 ${money(e.cost)} · 블로그 ${e.blog?'✓':'–'} 인스타 ${e.insta?'✓':'–'} 클립 ${e.clip?'✓':'–'}</p><button onclick="edit('${esc(e.id)}')">수정</button> <button onclick="del('${esc(e.id)}')">삭제</button> <button onclick="google('${esc(e.id)}')">구글 캘린더에 추가</button></div>`).join('')||'아직 등록된 협찬이 없어요.';let t=today();$('alerts').innerHTML=data.filter(e=>e.status!=='완료').flatMap(e=>{let r=[];if(e.date===t||e.date===add(t,1))r.push(`${esc(e.name)} · ${e.date===t?'오늘':'내일'} 방문`);if(due(e)&&due(e)<=add(t,3))r.push(`${esc(e.name)} · 리뷰 ${due(e)<t?'기한 초과':'마감 임박'} (${due(e)})`);return r}).map(x=>`<p>${x}</p>`).join('')||'현재 확인할 알림이 없어요.';renderPartner()}function google(id){let e=data.find(x=>x.id===id);if(!e.date||!e.time)return alert('방문일과 시간을 입력해주세요.');let start=new Date(e.date+'T'+e.time+':00+09:00'),end=new Date(+start+Number(e.duration)*60000),fmt=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');window.open('https://calendar.google.com/calendar/render?'+new URLSearchParams({action:'TEMPLATE',text:e.name,dates:fmt(start)+'/'+fmt(end),location:e.place,details:'리뷰 마감: '+due(e)}),'_blank','noopener')}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='sooring-backup.json';a.click();URL.revokeObjectURL(a.href)}async function restore(ev){try{let a=JSON.parse(await ev.target.files[0].text());if(!Array.isArray(a)||a.some(e=>!e.name||typeof e.id!=='string'||!/^[a-zA-Z0-9-]+$/.test(e.id)))throw Error();if(confirm('현재 목록을 백업 내용으로 교체할까요?')){data=a;save()}}catch{alert('올바른 백업 파일이 아닙니다.')}}function parse(){let s=$('sentence').value,d=s.match(/(?:(\d{4})년\s*)?(\d{1,2})월\s*(\d{1,2})일/),t=s.match(/(오전|오후)?\s*(\d{1,2})시(?:\s*(\d{1,2})분)?/),a=s.match(/([\d,.]+)\s*(만원|원)/),r=s.match(/(?:리뷰|마감)\s*(\d+)일/);if(d)f.elements.date.value=key(Number(d[1]||now.getFullYear()),Number(d[2])-1,Number(d[3]));if(t){let h=Number(t[2]);if(t[1])h=h%12+(t[1]==='오후'?12:0);f.elements.time.value=String(h).padStart(2,'0')+':'+String(t[3]||0).padStart(2,'0')}if(a)f.elements.amount.value=Number(a[1].replace(/,/g,''))*(a[2]==='만원'?10000:1);if(r)f.elements.days.value=r[1];let name=s;for(let match of [d,t,a,r])if(match)name=name.replace(match[0],'');f.elements.name.value=name.trim();f.oninput();$('parsemsg').textContent='입력란에 반영했어요. 업체명, 날짜와 시간을 확인하고 저장하세요.';f.scrollIntoView({behavior:'smooth'})}function mode(partner){$('admin').hidden=partner;$('partner').hidden=!partner;renderPartner()}function attendance(id,status){let e=data.find(x=>x.id===id);if(e){e.attendance=status;save()}}function renderPartner(){$('partnerItems').innerHTML=data.filter(e=>e.date&&['예약','방문','완료'].includes(e.status)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(e=>`<div class="item"><strong>${esc(e.name)}</strong><p>${esc(e.date)} · ${esc(e.time)} · ${esc(e.place)}</p><div style="background:#fafafa;border:1px solid #eee;border-radius:8px;padding:12px;margin:10px 0"><strong>리뷰 관리 · 읽기 전용</strong><p>리뷰 마감일: ${esc(due(e)||'미정')} ${e.status==='완료'?'· 완료':due(e)&&due(e)<today()?'· 기한 초과':''}</p><p>진행 상태: ${esc(e.status)}</p><div class="row">${[['블로그','blog'],['인스타','insta'],['네이버 클립','clip']].map(([label,k])=>`<span style="border:1px solid #ddd;border-radius:6px;padding:6px">${label} ${e[k]?'✓ 완료':'미체크'}</span>`).join('')}</div><p class="muted">필수 키워드 및 가이드라인</p><div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(e.guide||'등록된 가이드라인 없음')}</div></div><p>동행 여부: <strong>${esc(e.attendance||'미정')}</strong></p><div class="row">${['참석','불참','미정'].map(v=>`<button class="${(e.attendance||'미정')===v?'primary':''}" onclick="attendance('${esc(e.id)}','${v}')">${v}</button>`).join('')}</div></div>`).join('')||'공유할 방문 일정이 아직 없어요.'} 
const db=window.supabase?.createClient('https://ewnohozvjdstmeffmmap.supabase.co','sb_publishable_dVqvfONeu7o7FdsBU6L11w_KXG-WSNE');
let role=null,busy=false,epoch=0;
function msg(s){$('syncmsg').textContent=s}
function check(r){if(r.error)throw r.error;return r.data}
function hide(){role=null;data=[];$('admin').hidden=true;$('partner').hidden=true;$('account').hidden=true;$('login').hidden=false;render();resetForm()}
async function load(){let token=epoch;if(!role)return;let rows=check(await db.from('sponsorships').select('*'));let finances=role==='owner'?check(await db.from('sponsorship_finances').select('*')):[];if(token!==epoch||!role)return;let fm=new Map(finances.map(x=>[x.sponsorship_id,x]));data=rows.map(x=>({id:x.id,name:x.name,place:x.location||'',date:x.visit_date||'',time:(x.visit_time||'').slice(0,5),duration:x.duration_minutes??90,travel:x.travel_minutes??30,days:x.visit_date&&x.review_deadline?Math.round((Date.parse(x.review_deadline)-Date.parse(x.visit_date))/86400000):7,status:x.status,guide:x.guidelines||'',blog:x.blog_done,insta:x.instagram_done,clip:x.clip_done,attendance:x.attendance,amount:fm.get(x.id)?.benefit||0,cost:fm.get(x.id)?.expense||0}));render();msg('온라인 연결 · '+new Date().toLocaleTimeString('ko-KR'))}
async function start(){hide();if(!db){msg('연결 라이브러리를 불러오지 못했습니다.');return}try{let session=check(await db.auth.getSession()).session;if(!session)return;let member=check(await db.from('diary_members').select('role').eq('user_id',session.user.id).maybeSingle());if(!member){msg('등록된 회원 권한이 없습니다.');await db.auth.signOut();return}role=member.role;await load();$('login').hidden=true;$('account').hidden=false;$('rolelabel').textContent=role==='owner'?'관리자 계정':'동행 계정';mode(role==='partner')}catch(e){hide();msg(e.message)}}
$('loginform').onsubmit=async e=>{e.preventDefault();try{check(await db.auth.signInWithPassword({email:$('email').value,password:$('password').value}));$('password').value='';await start()}catch(e){msg(e.message)}};
async function logout(){epoch++;hide();try{check(await db.auth.signOut());msg('로그아웃되었습니다.')}catch(e){msg(e.message)}}
async function task(fn){if(busy)return;busy=true;try{await fn();await load()}catch(e){msg('저장 또는 연결 오류: '+e.message)}finally{busy=false}}
f.onsubmit=e=>{e.preventDefault();if(role!=='owner')return;let o=values();if(conflicts(o).length&&!confirm('시간 충돌 가능성이 있습니다. 저장할까요?'))return;task(async()=>{let id=editing||crypto.randomUUID(),row={id,name:o.name,location:o.place,visit_date:o.date||null,visit_time:o.time||null,duration_minutes:Number(o.duration),travel_minutes:Number(o.travel),review_deadline:due(o)||null,status:o.status,guidelines:o.guide,blog_done:o.blog,instagram_done:o.insta,clip_done:o.clip};check(await db.from('sponsorships').upsert(row));check(await db.from('sponsorship_finances').upsert({sponsorship_id:id,benefit:Number(o.amount),expense:Number(o.cost)}));resetForm()})};
del=id=>{if(role==='owner'&&confirm('삭제할까요?'))task(async()=>check(await db.from('sponsorships').delete().eq('id',id)))};
attendance=(id,status)=>{if(role==='partner')task(async()=>check(await db.rpc('set_attendance',{event_id:id,answer:status})))};
setInterval(()=>{if(role&&!busy&&!document.hidden)task(async()=>{})},15000);start();
